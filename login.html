<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>FallGuard - Login</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
  />

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1a1a18;
      --sub: #777;
      --red: #E24B4A;
      --border: rgba(0,0,0,0.08);
      --shadow: 0 4px 15px rgba(0,0,0,0.07);
      --radius: 16px;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* PHONE */

    .phone {
      width: 390px;
      max-width: 100%;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    /* LOGIN CONTAINER */

    .login-container {
      width: 100%;
    }

    /* LOGO */

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-icon {
      width: 70px;
      height: 70px;
      background: var(--red);
      color: white;
      border-radius: 20px;

      display: flex;
      justify-content: center;
      align-items: center;

      margin: 0 auto 14px;

      font-size: 34px;

      box-shadow:
        0 5px 15px rgba(226,75,74,0.25);
    }

    .logo-name {
      font-size: 25px;
      font-weight: bold;
      color: var(--text);
    }

    .logo-sub {
      font-size: 12px;
      color: var(--sub);
      margin-top: 5px;
    }

    /* LOGIN CARD */

    .login-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .welcome {
      font-size: 20px;
      font-weight: bold;
      color: var(--text);
      margin-bottom: 5px;
      text-align: center;
    }

    .description {
      font-size: 12px;
      color: var(--sub);
      margin-bottom: 22px;
      text-align: center;
    }

    /* INPUT */

    .input-group {
      margin-bottom: 16px;
    }

    .input-label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: var(--text);
      margin-bottom: 7px;
    }

    .input-box {
      position: relative;
    }

    .input-box i {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
      font-size: 18px;
    }

    .input-box input {
      width: 100%;
      height: 45px;

      border: 1px solid var(--border);
      border-radius: 12px;

      padding: 0 42px;

      outline: none;

      font-size: 13px;

      background: #fafafa;

      transition: 0.2s;
    }

    .input-box input:focus {
      border-color: var(--red);
      background: white;
    }

    /* PASSWORD TOGGLE */

    .password-toggle {
      position: absolute;
      right: 13px;
      left: auto !important;

      cursor: pointer;
      color: #999;
    }

    .password-toggle:hover {
      color: var(--red);
    }

    /* OPTIONS */

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin: 5px 0 20px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;

      font-size: 11px;
      color: var(--sub);

      cursor: pointer;
    }

    .remember input {
      accent-color: var(--red);
      cursor: pointer;
    }

    .forgot {
      font-size: 11px;
      color: var(--red);
      font-weight: bold;
      cursor: pointer;
    }

    /* LOGIN BUTTON */

    .login-btn {
      width: 100%;

      border: none;
      border-radius: 13px;

      padding: 13px;

      background: var(--red);
      color: white;

      font-size: 14px;
      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }

    .login-btn:hover {
      transform: translateY(-1px);

      box-shadow:
        0 5px 12px rgba(226,75,74,0.25);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    /* FOOTER */

    .footer {
      text-align: center;
      margin-top: 20px;

      font-size: 10px;
      color: #999;
    }

    .footer strong {
      color: var(--red);
    }

  </style>

</head>

<body>

<div class="phone">

  <div class="login-container">

    <!-- LOGO -->

    <div class="logo">

      <div class="logo-icon">
        <i class="ti ti-shield-heart"></i>
      </div>

      <div class="logo-name">
        FallGuard
      </div>

      <div class="logo-sub">
        Elderly Safety Monitoring System
      </div>

    </div>


    <!-- LOGIN CARD -->

    <div class="login-card">

      <div class="welcome">
        Welcome Back
      </div>

      <div class="description">
        Sign in to access the caregiver dashboard.
      </div>


      <!-- EMAIL -->

      <div class="input-group">

        <label class="input-label">
          Email
        </label>

        <div class="input-box">

          <i class="ti ti-mail"></i>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
          />

        </div>

      </div>


      <!-- PASSWORD -->

      <div class="input-group">

        <label class="input-label">
          Password
        </label>

        <div class="input-box">

          <i class="ti ti-lock"></i>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
          />

          <i
            class="ti ti-eye password-toggle"
            id="togglePassword">
          </i>

        </div>

      </div>


      <!-- OPTIONS -->

      <div class="options">

        <label class="remember">

          <input
            type="checkbox"
            id="remember"
          />

          Remember me

        </label>

        <div class="forgot">
          Forgot Password?
        </div>

      </div>


      <!-- LOGIN BUTTON -->

      <button
        class="login-btn"
        onclick="login()">

        Sign In

      </button>

    </div>


    <!-- FOOTER -->

    <div class="footer">
      FallGuard v1.0 ·
      <strong>Caregiver Portal</strong>
    </div>

  </div>

</div>


<script>

  /* =========================
     SHOW / HIDE PASSWORD
     ========================= */

  document
    .getElementById("togglePassword")
    .addEventListener("click", function () {

      const password =
        document.getElementById("password");

      if (password.type === "password") {

        password.type = "text";

        this.classList.remove("ti-eye");

        this.classList.add("ti-eye-off");

      } else {

        password.type = "password";

        this.classList.remove("ti-eye-off");

        this.classList.add("ti-eye");

      }

    });


  /* =========================
     TEMPORARY LOGIN
     ========================= */

  function login() {

    const email =
      document.getElementById("email").value;

    const password =
      document.getElementById("password").value;


    /*
      TEMPORARY LOGIN

      No database connection yet.

      Any email and password will
      currently allow access.
    */

    if (email === "" || password === "") {

      alert(
        "Please enter your email and password."
      );

      return;

    }


    // Redirect to dashboard

    window.location.href = "index.html";

  }

</script>

</body>
</html>
