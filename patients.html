<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FallGuard - Patients</title>

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1a1a18;
      --sub: #777;
      --red: #E24B4A;
      --green: #3B9C3A;
      --blue: #378ADD;
      --orange: #F6A623;
      --shadow: 0 4px 12px rgba(0,0,0,0.06);
      --radius: 16px;
      --border: rgba(0,0,0,0.08);
    }

    body {
      background: var(--bg);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .phone {
      width: 390px;
      max-width: 100%;
      min-height: 100vh;
      background: var(--bg);
      position: relative;
      overflow-x: hidden;
    }

    /* Topbar */
    .topbar {
      background: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      font-size: 22px;
      cursor: pointer;
    }

    .back-btn:hover {
      color: var(--red);
    }

    .title {
      font-size: 18px;
      font-weight: bold;
      color: var(--text);
    }

    .search-icon {
      font-size: 22px;
      cursor: pointer;
    }

    /* Content */
    .content {
      padding: 18px;
      padding-bottom: 100px;
    }

    .search-box {
      background: white;
      padding: 12px 14px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .search-box input {
      border: none;
      outline: none;
      flex: 1;
      font-size: 14px;
    }

    .section-title {
      font-size: 13px;
      font-weight: bold;
      color: #888;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Patient Card */
    .patient-card {
      background: white;
      border-radius: var(--radius);
      padding: 15px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .patient-card:hover {
      transform: translateY(-2px);
    }

    .patient-left {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }

    .red {
      background: var(--red);
    }

    .green {
      background: var(--green);
    }

    .blue {
      background: var(--blue);
    }

    .patient-name {
      font-size: 15px;
      font-weight: bold;
      color: var(--text);
    }

    .patient-meta {
      font-size: 12px;
      color: var(--sub);
      margin-top: 2px;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
      margin-top: 6px;
    }

    .danger {
      background: #fde9e9;
      color: var(--red);
    }

    .safe {
      background: #e8f7ea;
      color: var(--green);
    }

    .rest {
      background: #eef4ff;
      color: var(--blue);
    }

    /* Summary */
    .summary-card {
      background: white;
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-top: 10px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .summary-box {
      background: #fafafa;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
    }

    .summary-value {
      font-size: 22px;
      font-weight: bold;
      margin-top: 4px;
    }

    .label {
      font-size: 11px;
      color: var(--sub);
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 390px;
      max-width: 100%;
      background: white;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.04);
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      color: #777;
      cursor: pointer;
    }

    .nav-btn i {
      font-size: 20px;
    }

    .active {
      color: var(--red);
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="phone">

  <!-- Topbar -->
  <div class="topbar">

    <div class="top-left">

      <!-- Back Button -->
      <i
        class="ti ti-arrow-left back-btn"
        id="backBtn">
      </i>

      <div class="title">
        Patients
      </div>

    </div>

    <i class="ti ti-search search-icon"></i>

  </div>


  <div class="content">

    <!-- Search -->
    <div class="search-box">
      <i class="ti ti-search"></i>
      <input type="text" placeholder="Search patient..." />
    </div>


    <!-- Patient List -->
    <div class="section-title">
      Patient List
    </div>


    <!-- Lolo Pete -->
    <div class="patient-card">

      <div class="patient-left">

        <div class="avatar red">
          LP
        </div>

        <div>
          <div class="patient-name">
            Lolo Pete
          </div>

          <div class="patient-meta">
            Room 3 • High Risk
          </div>

          <span class="badge danger">
            Fall Alert
          </span>
        </div>

      </div>

      <i class="ti ti-chevron-right"></i>

    </div>


    <!-- Lola Ana -->
    <div class="patient-card">

      <div class="patient-left">

        <div class="avatar green">
          LA
        </div>

        <div>
          <div class="patient-name">
            Lola Ana
          </div>

          <div class="patient-meta">
            Room 1 • Stable
          </div>

          <span class="badge safe">
            Walking
          </span>
        </div>

      </div>

      <i class="ti ti-chevron-right"></i>

    </div>


    <!-- Mang Ben -->
    <div class="patient-card">

      <div class="patient-left">

        <div class="avatar blue">
          MB
        </div>

        <div>
          <div class="patient-name">
            Mang Ben
          </div>

          <div class="patient-meta">
            Room 2 • Stable
          </div>

          <span class="badge rest">
            Resting
          </span>
        </div>

      </div>

      <i class="ti ti-chevron-right"></i>

    </div>


    <!-- Summary -->
    <div class="section-title">
      Summary
    </div>


    <div class="summary-card">

      <div class="summary-grid">

        <div class="summary-box">
          <div class="label">
            Total
          </div>

          <div class="summary-value">
            3
          </div>
        </div>


        <div class="summary-box">
          <div class="label">
            Alert
          </div>

          <div
            class="summary-value"
            style="color:#E24B4A;">
            1
          </div>
        </div>


        <div class="summary-box">
          <div class="label">
            Safe
          </div>

          <div
            class="summary-value"
            style="color:#3B9C3A;">
            2
          </div>
        </div>

      </div>

    </div>

  </div>


  <!-- Bottom Navigation -->
  <div class="bottom-nav">

    <div class="nav-btn">
      <i class="ti ti-home"></i>
      <span>Home</span>
    </div>

    <div class="nav-btn active">
      <i class="ti ti-users"></i>
      <span>Patients</span>
    </div>

    <div class="nav-btn">
      <i class="ti ti-bell"></i>
      <span>Alerts</span>
    </div>

    <div class="nav-btn">
      <i class="ti ti-history"></i>
      <span>History</span>
    </div>

    <div class="nav-btn">
      <i class="ti ti-settings"></i>
      <span>Settings</span>
    </div>

  </div>

</div>


<script>

  /* =========================
     BACK BUTTON
     ========================= */

  document
    .getElementById("backBtn")
    .addEventListener("click", function () {

      window.location.href = "index.html";

    });


  /* =========================
     BOTTOM NAVIGATION
     ========================= */

  document
    .querySelectorAll(".nav-btn")
    .forEach(btn => {

      btn.addEventListener("click", () => {

        const page = btn.textContent.trim();

        if (page === "Home") {
          window.location.href = "index.html";
        }

        if (page === "Patients") {
          window.location.href = "patients.html";
        }

        if (page === "Alerts") {
          window.location.href = "alerts.html";
        }

        if (page === "History") {
          window.location.href = "history.html";
        }

        if (page === "Settings") {
          window.location.href = "settings.html";
        }

      });

    });

</script>

</body>
</html>
